name: XEQM sidecar build

# Reproducible static builds of the Session Router relay sidecar for XEQM, for both
# Linux architectures, packaged with the operator kit in contrib/xeqm and published
# with sha256 checksums. Runs on a sidecar-v* tag (attaches to that release) and on
# manual dispatch (artifacts only).
#
# The build runs in an Ubuntu 22.04 container so the binaries need glibc 2.35 at
# most: Ubuntu 22.04 and newer, Debian 12 and newer.

on:
  push:
    tags:
      - 'sidecar-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (default: this ref)'
        required: false

permissions:
  contents: read

env:
  # Newest glibc symbol version the released binaries may require.
  GLIBC_BASELINE: '2.35'

jobs:
  build:
    name: static ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates pkg-config \
            automake autoconf libtool patch python3 xz-utils ccache \
            libsodium-dev libssl-dev libunbound-dev

      - name: Checkout (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-jammy-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-jammy-${{ matrix.arch }}-

      - name: Configure (static deps)
        run: |
          cmake -G Ninja -B build \
            -DBUILD_STATIC_DEPS=ON \
            -DSROUTER_NATIVE_BUILD=OFF \
            -DWITH_SYSTEMD=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLOCAL_MIRROR=https://oxen.rocks/deps

      - name: Build
        run: ninja -C build session-router session-router-config

      - name: Verify portable (static) linkage
        run: contrib/ci/check-static-libs.sh build

      - name: Verify glibc baseline
        run: |
          for b in session-router session-router-config; do
            need="$(objdump -T "build/$b" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -n1)"
            [ -n "$need" ] || { echo "could not read glibc versions from $b" >&2; exit 1; }
            echo "$b needs $need"
            newest="$(printf '%s\n' "GLIBC_${GLIBC_BASELINE}" "$need" | sort -V | tail -n1)"
            if [ "$newest" != "GLIBC_${GLIBC_BASELINE}" ]; then
              echo "$b needs a newer glibc than ${GLIBC_BASELINE}" >&2
              exit 1
            fi
          done

      - name: Confirm XEQM build
        run: ./build/session-router --version

      - name: Package
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="$(git describe --tags --always)"
          fi
          contrib/xeqm/make-package.sh "${{ matrix.arch }}" build "$ver" "$PWD/dist"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: session-router-xeqm-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "XEQM Session Router sidecar (non-enforcing). Verify downloads against the attached .sha256 files."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
